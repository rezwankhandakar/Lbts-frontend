<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LBTS</title>
    <script>
      // Runs before first paint so a dark-mode reload never flashes light.
      // Reads the same localStorage key and envelope that zustand/persist
      // writes in src/stores/use-theme-store.ts - keep the two in sync.
      ;(function () {
        try {
          var stored = localStorage.getItem('lbts-theme')
          var theme = stored ? JSON.parse(stored).state.theme : null
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          // localStorage can throw in private mode; fall back to light.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
